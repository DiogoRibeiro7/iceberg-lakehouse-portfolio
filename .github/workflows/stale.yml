name: Stale Issues and PRs

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has had no activity for 60 days and is marked as stale.
            It will be closed in 14 days if there is no further activity.
          stale-pr-message: >
            This pull request has had no activity for 30 days and is marked as stale.
            It will be closed in 14 days if there is no further activity.
          close-issue-message: >
            Closing this issue due to inactivity. Reopen if this is still relevant.
          close-pr-message: >
            Closing this pull request due to inactivity. Reopen if work resumes.
          stale-issue-label: stale
          stale-pr-label: stale
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-issue-close: 14
          days-before-pr-close: 14
          exempt-issue-labels: "security,pinned"
          exempt-pr-labels: "security,pinned,dependencies"
