name: Feature request
description: Propose an improvement or new capability.
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: Describe the user or engineering pain point.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the preferred approach.
      placeholder: Outline the change and expected behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options and why they were not selected.
  - type: textarea
    id: scope
    attributes:
      label: Scope and impact
      description: Affected components and potential tradeoffs.
