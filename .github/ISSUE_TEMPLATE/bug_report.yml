name: Bug report
description: Report a reproducible problem in the project.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please provide enough detail for reproduction.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what you expected.
      placeholder: Short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands or actions to reproduce.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Relevant logs, stack traces, or screenshots.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Docker version, and branch/commit.
      placeholder: Windows 11, Python 3.11, Docker 27.x, develop
